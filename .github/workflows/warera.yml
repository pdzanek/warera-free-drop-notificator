name: warera-scan
on:
  # Triggered externally (cron-job.org) through the workflow_dispatch API.
  # The built-in schedule trigger is intentionally not used (unreliable).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan for FREE deals
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_AVATAR_URL: ${{ secrets.DISCORD_AVATAR_URL }}
        run: python notify.py
      - name: Save notification state
        run: |
          git config user.name "warera-bot"
          git config user.email "warera-bot@users.noreply.github.com"
          git add -f notified.json || true
          git diff --cached --quiet && exit 0
          git commit -m "update notified.json" || exit 0
          git pull --rebase || { git rebase --abort || true; }
          git push || echo "WARN: could not save notified.json (conflict) - notifications were still sent"
