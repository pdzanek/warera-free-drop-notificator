name: warera-scan
on:
  schedule:
    # Off-peak minutes: GitHub's scheduler is congested at :00/:15/:30/:45.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan for FREE deals
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FREE_DMG: "1000"
          MAX_PTS_LEFT: "100"
          SEEN_HOURS: "6"
        run: python notify.py
      - name: Save notification state
        run: |
          git config user.name "warera-bot"
          git config user.email "warera-bot@users.noreply.github.com"
          git add -f notified.json || true
          git diff --cached --quiet && exit 0
          git commit -m "update notified.json" || exit 0
          git pull --rebase || { git rebase --abort || true; }
          git push || echo "WARN: could not save notified.json (conflict) - notifications were still sent"
